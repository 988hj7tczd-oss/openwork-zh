name: Build & Release (macOS/Windows/Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-arm64
            electron_arch: --arm64
          - os: macos-14
            artifact: macos-x64
            electron_arch: --x64
          - os: ubuntu-latest
            artifact: linux
            electron_arch: ""
          - os: windows-latest
            artifact: windows
            electron_arch: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so setup-node can find the
      # pnpm binary on PATH. Matches the official build workflow.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        # supportedArchitectures 已在 pnpm-workspace.yaml 配置（安装所有平台 optional 二进制）
        run: pnpm install --frozen-lockfile

      - name: Build Electron
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Electron desktop (no publish)
        # publish 配置硬编码指向官方仓库(different-ai/openwork)，必须 --publish never
        # 产物由下方 release job 统一发布到 openwork-zh 的 Releases
        # electron_arch 显式指定 mac 架构（arm64/x64），避免产物文件名撞车
        run: pnpm --filter @openwork/desktop exec electron-builder --config electron-builder.yml --publish never ${{ matrix.electron_arch }}

      - name: Upload Electron artifacts
        # 只上传安装包文件，避免中间产物污染 Release
        uses: actions/upload-artifact@v4
        with:
          name: openwork-zh-${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5-zh.1
          name: OpenWork 中文社区版 v0.1.5-zh.1
          body: |
            ## OpenWork 中文社区版 v0.1.5-zh.1

            100% 简体中文界面的 AI 工作流共享桌面应用（基于 different-ai/openwork，非官方社区版）。

            ### 平台安装包

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | macOS (Apple Silicon) | `openwork-mac-arm64-*.dmg` / `.zip` | 未签名，首次打开需右键 → 打开 |
            | macOS (Intel) | `openwork-mac-x64-*.dmg` / `.zip` | 未签名，首次打开需右键 → 打开 |
            | Windows | `openwork-win-*.exe` | NSIS 安装包 |
            | Linux | `openwork-linux-*.AppImage` / `*.tar.gz` | AppImage 需 `chmod +x` 后运行 |

            ### 快速开始

            1. 下载对应平台安装包并安装
            2. 打开 OpenWork，选择一个文件夹作为工作区
            3. 点击左下角设置 → 外观 → 语言，选择「简体中文」
            4. 连接你的模型提供商（OpenAI / Anthropic / DeepSeek 等）
            5. 在输入框输入任务，开始使用

            ### 相关链接

            - 独立站：https://www.aibunkhouse.com/tools/
          files: release-artifacts/**

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@opencode-ai/sdk"
  - "acorn"
  - "enhanced-resolve"
  - "postcss"

# 安装所有平台/架构的 optional 二进制（node-pty 等），
# 否则跨架构打包（mac x64）会缺平台包
supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - darwin
    - linux
    - win32

packages:
  - "apps/*"
  - "packages/*"
  - "ee/apps/*"
  - "ee/packages/*"

catalog:
  react: 19.2.4
  react-dom: 19.2.4

catalogs:
  react18:
    react: 18.2.0
    react-dom: 18.2.0
linkWorkspacePackages: true
preferWorkspacePackages: true
allowBuilds:
  "@sentry/cli": true
  "@whiskeysockets/baileys": true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: false
  node-pty: true
  protobufjs: true
  sharp: true
patchedDependencies:
  '@better-auth/drizzle-adapter@1.6.11': patches/@better-auth__drizzle-adapter@1.6.11.patch
  '@better-auth/oauth-provider@1.6.11': patches/@better-auth__oauth-provider@1.6.11.patch
  '@modelcontextprotocol/sdk': patches/@modelcontextprotocol__sdk.patch
